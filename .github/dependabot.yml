version: 2
updates:
  # "uv", not "pip". The pip ecosystem read requirements.txt, which #93 deleted
  # for duplicating pyproject.toml and drifting: it pinned black, aws-cdk-lib,
  # pydantic, typeguard, types-boto3, and tf-ecosystem, none of which this
  # project depends on or imports. Every pip PR dependabot opened was therefore
  # maintaining a dependency set that did not exist. The uv ecosystem reads
  # pyproject.toml and updates the committed uv.lock, which is what CI installs
  # from (`uv sync --locked`).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    reviewers:
      - "scttfrdmn"
    commit-message:
      # "build", not "deps". `deps` is not in commitlint.config.js's type-enum,
      # so every PR dependabot opened carried a subject the repo's own
      # commit-msg hook rejects (#184). It went unnoticed because commitlint
      # runs only via pre-commit and dependabot commits server-side, so the hook
      # never fires on them -- the failure surfaces only when a human rebases or
      # amends the branch. `build` is the conventional-commits type for
      # dependency changes and is already allowed; `include: scope` appends
      # `(deps)`, which scope-enum also allows, giving `build(deps): ...`.
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "scttfrdmn"
    commit-message:
      prefix: "ci"
      include: "scope"

