# Ruff configuration for Parsl AWS Provider

[lint]
extend-ignore = [
    # F821: Undefined name - ignore in template strings where variables are defined in generated code
    "F821",
    # F841: Local variable assigned but never used - ignore unused variables in certain contexts
    "F841",
]

# Was a top-level [per-file-ignores], which ruff deprecated in favour of the lint
# section and warned about on every single invocation.
[lint.per-file-ignores]
# Allow F821 errors in compute modules that generate dynamic code templates
"parsl_aws_provider/compute/*.py" = ["F821", "F841"]
