[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parsl_ephemeral_aws*"]

# packages.find collects modules, not data files, so without this the
# CloudFormation and Terraform templates are omitted from the wheel and
# get_cf_template() cannot find bastion.yml in an installed package (#112).
[tool.setuptools.package-data]
parsl_ephemeral_aws = [
    "templates/cloudformation/*.yml",
    "templates/terraform/*/*.tf",
]

[project]
name = "parsl-ephemeral-aws"
version = "0.8.0"
description = "A modern, flexible AWS provider for the Parsl parallel scripting library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Scott Friedman and Project Contributors", email = "email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "parsl>=2026.4.20",
    "boto3>=1.20.0",
    "botocore>=1.23.0",
    # Floor is the lowest release clearing every advisory that affects the code
    # this project runs, not the newest release available. GHSA-537c-gmf6-5ccf
    # (HIGH) is the vulnerable OpenSSL bundled into the wheels -- 46.0.5 ships
    # OpenSSL 3.5.5 -- fixed in 48.0.1, and this is a *runtime* dependency, so a
    # consumer installing the provider inherits whatever the floor permits.
    # 48.0.1 also clears GHSA-m959-cc7f-wv43 (fixed 46.0.6) and
    # GHSA-p423-j2cm-9vmq (46.0.7).
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
    # 9.0.3 fixes GHSA-6w46-j5rx-g56g, insecure tmpdir handling. Dev-only, so the
    # exposure is a developer's own machine rather than a consumer's.
    "pytest>=9.0.3",
    "pytest-cov>=2.12.0",
    "pytest-mock>=3.0.0",
    "coverage>=6.0",
    # Floor matches the ruff-pre-commit pin so the hook and `uv run ruff` cannot
    # disagree on formatting; at 0.2.x they differed on comprehension-conditional
    # parenthesization and each would undo the other's output.
    "ruff>=0.15.4",
    "mypy>=2.3.0",
    "bandit>=1.7.0",
    "pre-commit>=2.15.0",
    "bump-my-version>=1.0.0",
]
test = [
    # moto 5 replaced the per-service decorators (mock_ec2, mock_s3, ...) with a
    # single mock_aws; the tests use mock_aws, so 5.0 is a hard floor.
    "moto[cloudformation]>=5.0.0",
    # `localstack` dropped (#125). It was only ever the CLI wrapper -- nothing
    # imported it, the emulator ran as a container, and LocalStack OSS is now
    # end-of-life. Substrate needs no Python package: it is a single Go binary,
    # pulled as ghcr.io/scttfrdmn/substrate by docker-compose.substrate.yml.
    # 2.33.0 fixes GHSA-gc5v-m9x4-r6x2, insecure temp-file reuse in
    # extract_zipped_paths(). Nothing here calls it, but requests is a test
    # dependency only and the bump costs nothing.
    "requests>=2.33.0",
]
globus = [
    # Floor raised from >=2.0.0, which no longer described anything installable
    # (#87). Two independent reasons:
    #
    # 1. globus-compute-endpoint pins parsl *exactly*, and only 4.10.1+ pins
    #    parsl==2026.4.20 -- which is this project's floor. Every earlier release
    #    pins an older parsl and cannot resolve alongside it.
    # 2. The `config.py` shim written by generate_endpoint_config() imports
    #    `globus_compute_endpoint.endpoint.config.utils.load_config_yaml`. That
    #    module does not exist before 2.2.0, so a 2.0.x install would produce a
    #    generated config that fails with ModuleNotFoundError at endpoint start
    #    rather than at install time.
    "globus-compute-sdk>=4.10.1",
    "globus-compute-endpoint>=4.10.1",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    # docs/conf.py has listed myst_parser in `extensions` all along without it
    # being declared here, so `make -C docs html` died on
    # `ExtensionError: Could not import extension myst_parser`. All but three of
    # the doc sources are Markdown, so this is load-bearing, not optional.
    "myst-parser>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/scttfrdmn/parsl-aws-provider"
"Bug Tracker" = "https://github.com/scttfrdmn/parsl-aws-provider/issues"
"Documentation" = "https://parsl-ephemeral-aws.readthedocs.io"

# [tool.uv] conflicts removed with the localstack dependency (#125). The pin
# existed because globus-compute-sdk requires dill==0.3.9 while localstack<4.10
# requires dill 0.3.2/0.3.6, so uv could not resolve `globus` and `test`
# together. Nothing else in either extra conflicts, so both now install side by
# side and the unit suite no longer has to run outside the globus extra.

# [tool.black] and [tool.isort] removed: the repo formats with ruff-format (see
# .pre-commit-config.yaml), whose default line length is 88, so `line-length =
# 100` here silently disagreed with how every file is actually formatted --
# running black reformatted ~80 unrelated lines. ruff's isort rules cover import
# sorting. Both tools also stayed in the `dev` extra long after nothing invoked
# them; they are dropped from there too.

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = [
    "--strict-markers",
    "--cov=parsl_ephemeral_aws",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    # A smoke floor only. This applies to *every* invocation, including narrow
    # ones -- `pytest tests/integration` alone measures 34% -- so it cannot carry
    # the project's real coverage target without breaking subset runs. The gate
    # that matters is `--cov-fail-under=65` on the CI unit-tests job, which runs
    # tests/unit + tests/security together (68% measured).
    "--cov-fail-under=25",
    "-ra",
    "--tb=short"
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require the substrate AWS emulator)",
    "aws: Tests requiring real AWS credentials",
    "globus: Tests requiring Globus Compute credentials and a running endpoint",
    "slow: Slow-running tests",
    # Renamed from `localstack` in #125. Kept as a distinct marker from
    # `integration` because a subset of that directory is pure-moto and needs
    # no endpoint at all.
    "substrate: Tests requiring a running substrate AWS emulator",
    # Applied automatically by pytest_collection_modifyitems, never by hand.
    "setenv_aws(name, value): internal — synthetic AWS credentials for non-aws tests",
]

[tool.coverage.run]
source = ["parsl_ephemeral_aws"]
branch = true
omit = [
    "tests/*",
    "examples/*",
    "*/__init__.py",
    "*/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
]
fail_under = 10
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.bumpversion]
current_version = "0.8.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "parsl_ephemeral_aws/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
