[build-system]
# 77.0.1, not the inherited 42: PEP 639 support -- the `license = "Apache-2.0"`
# SPDX string and `license-files` below -- landed in setuptools 77.0. Anything
# older rejects this file outright; 76.0.0 fails validation with "project.license
# must be one of [{file}, {text}]". So `>=42` advertised a build that cannot
# happen. It went unnoticed because every environment here resolves something
# current, and only a consumer pinning an old setuptools would have hit it --
# which is exactly what publishing an sdist to PyPI invites (#180). 77.0.0 was
# yanked, so 77.0.1 is the lowest installable release that works.
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parsl_ephemeral_provider*"]

# packages.find collects modules, not data files, so without this the
# CloudFormation templates are omitted from the wheel and get_cf_template()
# cannot find bastion.yml in an installed package (#112). The Terraform glob
# that sat beside this one went with #90 -- those modules deployed nothing.
[tool.setuptools.package-data]
parsl_ephemeral_provider = [
    "templates/cloudformation/*.yml",
]

[project]
name = "parsl-ephemeral-provider"
version = "0.8.0"
# "for AWS" relationally, never "AWS provider". AWS Trademark Guidelines s7 (rev.
# 2026-07-17): "You will not combine, abbreviate, telescope, or hyphenate AWS Marks
# with any other words" and "will not incorporate AWS Marks into the names of your
# organization, products, or services". s13 permits plain-text factual reference in
# the form [Your Brand] [relational phrase] [AWS Mark] -- "YourApp for Amazon S3" --
# so the mark belongs in this description, not in the distribution name. #189 named
# this project `parsl-aws-provider`, which s7 does not survive.
description = "An independent Parsl provider for running ephemeral compute on AWS"
readme = "README.md"
# Not decoration, and not optional. These were **empty**, which meant the
# distribution name carried 100% of discoverability -- so dropping "aws" from the
# name would genuinely have cut findability to near zero. PyPI indexes name,
# summary and keywords, and s13 permits the mark in all the factual ones. Net
# effect is *more* discoverable than before the rename, not less. Keep in sync with
# the GitHub topics.
keywords = [
    "parsl",
    "aws",
    "ec2",
    "spot-instances",
    "ec2-fleet",
    "lambda",
    "fargate",
    "ecs",
    "ephemeral",
    "hpc",
    "workflow",
    "scientific-computing",
    "globus-compute",
]
requires-python = ">=3.10"
# PEP 639: an SPDX expression string, not the legacy {text = ...} table. The two
# forms cannot be mixed -- declaring license-files below makes setuptools validate
# this key against PEP 639, which rejects the table with "project.license must be
# string".
license = "Apache-2.0"
# Apache 2.0 section 4(d) requires the NOTICE text to travel with any
# redistribution, and setuptools does not include it by default -- only LICENSE is
# picked up automatically. Naming both here puts them in the wheel's
# .dist-info/licenses/ and in the sdist. NOTICE carries the independent-project
# disclaimer and the AWS/Parsl/Globus trademark attribution (#189).
license-files = ["LICENSE", "NOTICE"]
# Name only, no email. This carried a placeholder address that would have shipped
# in the wheel's METADATA as an Author-email header -- worse than absent, because
# tooling treats it as a real contact. PEP 621 makes `email` optional, so omitting
# the key is valid and leaves METADATA carrying `Author` alone. Security reports go
# through the private GitHub advisory path in SECURITY.md, not to a maintainer
# mailbox, so no address is load-bearing. Verified against a built wheel and sdist:
# neither PKG-INFO nor METADATA emits an Author-email line.
authors = [
    {name = "Scott Friedman and Project Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "parsl>=2026.4.20",
    "boto3>=1.20.0",
    "botocore>=1.23.0",
    # Floor is the lowest release clearing every advisory that affects the code
    # this project runs, not the newest release available. GHSA-537c-gmf6-5ccf
    # (HIGH) is the vulnerable OpenSSL bundled into the wheels -- 46.0.5 ships
    # OpenSSL 3.5.5 -- fixed in 48.0.1, and this is a *runtime* dependency, so a
    # consumer installing the provider inherits whatever the floor permits.
    # 48.0.1 also clears GHSA-m959-cc7f-wv43 (fixed 46.0.6) and
    # GHSA-p423-j2cm-9vmq (46.0.7).
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
    # 9.0.3 fixes GHSA-6w46-j5rx-g56g, insecure tmpdir handling. Dev-only, so the
    # exposure is a developer's own machine rather than a consumer's.
    "pytest>=9.0.3",
    # 7.1.0 makes the total coverage figure independent of reporting options
    # (pytest-cov#641). That is a correctness fix for the thing this repo gates
    # on: `--cov-fail-under=65` in CI and `=25` in `[tool.pytest.ini_options]`
    # were comparing against a total that could shift with `--cov-report`.
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.0.0",
    "coverage>=6.0",
    # Floor matches the ruff-pre-commit pin so the hook and `uv run ruff` cannot
    # disagree on formatting; at 0.2.x they differed on comprehension-conditional
    # parenthesization and each would undo the other's output. Both move together
    # or neither does -- see .pre-commit-config.yaml.
    "ruff>=0.16.0",
    "mypy>=0.812",
    "bandit>=1.7.0",
    "pre-commit>=2.15.0",
    "bump-my-version>=1.0.0",
]
test = [
    # moto 5 replaced the per-service decorators (mock_ec2, mock_s3, ...) with a
    # single mock_aws; the tests use mock_aws, so 5.0 is a hard floor.
    "moto[cloudformation]>=5.0.0",
    # `localstack` dropped (#125). It was only ever the CLI wrapper -- nothing
    # imported it, the emulator ran as a container, and LocalStack OSS is now
    # end-of-life. Substrate needs no Python package: it is a single Go binary,
    # pulled as ghcr.io/scttfrdmn/substrate by docker-compose.substrate.yml.
    # 2.33.0 fixes GHSA-gc5v-m9x4-r6x2, insecure temp-file reuse in
    # extract_zipped_paths(). Nothing here calls it, but requests is a test
    # dependency only and the bump costs nothing.
    "requests>=2.33.0",
]
globus = [
    # Floor raised from >=2.0.0, which no longer described anything installable
    # (#87). Two independent reasons:
    #
    # 1. globus-compute-endpoint pins parsl *exactly*, and only 4.10.1+ pins
    #    parsl==2026.4.20 -- which is this project's floor. Every earlier release
    #    pins an older parsl and cannot resolve alongside it.
    # 2. The `config.py` shim written by generate_endpoint_config() imports
    #    `globus_compute_endpoint.endpoint.config.utils.load_config_yaml`. That
    #    module does not exist before 2.2.0, so a 2.0.x install would produce a
    #    generated config that fails with ModuleNotFoundError at endpoint start
    #    rather than at install time.
    "globus-compute-sdk>=4.10.1",
    "globus-compute-endpoint>=4.10.1",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    # docs/conf.py has listed myst_parser in `extensions` all along without it
    # being declared here, so `make -C docs html` died on
    # `ExtensionError: Could not import extension myst_parser`. All but three of
    # the doc sources are Markdown, so this is load-bearing, not optional.
    "myst-parser>=2.0.0",
]

[project.scripts]
# The orphan sweep has to be reachable from an installed wheel. It used to live at
# `tools/cleanup_aws_resources.py`, which ships in neither the wheel nor the sdist,
# so every `python tools/cleanup_aws_resources.py` line in the docs worked only
# inside a git clone (#198). Nothing terminates instances automatically -- Parsl
# never calls provider.shutdown() -- so this is the tool that bounds the bill after
# a crash, and it was the one thing not distributed.
parsl-ephemeral-cleanup = "parsl_ephemeral_provider.cleanup:main"

[project.urls]
"Homepage" = "https://github.com/scttfrdmn/parsl-ephemeral-provider"
"Bug Tracker" = "https://github.com/scttfrdmn/parsl-ephemeral-provider/issues"
# GitHub Pages, not Read the Docs. This read
# `https://parsl-ephemeral-provider.readthedocs.io` and 404'd -- as did the old name,
# so it was a pre-existing dead link the #189 rename carried forward rather than
# fallout from it. RTD was never configured: no `.readthedocs.yaml`, no project
# under either name.
#
# These URLs are baked into wheel and sdist metadata and become the links on the
# PyPI landing page, so this had to resolve before the first publish (#180) or be
# dropped. CI's `docs` job had been building the HTML on every PR all along and
# never publishing it; `deploy-docs` now ships it on pushes to main (#191).
"Documentation" = "https://scttfrdmn.github.io/parsl-ephemeral-provider/"
"Changelog" = "https://github.com/scttfrdmn/parsl-ephemeral-provider/blob/main/CHANGELOG.md"

# [tool.uv] conflicts removed with the localstack dependency (#125). The pin
# existed because globus-compute-sdk requires dill==0.3.9 while localstack<4.10
# requires dill 0.3.2/0.3.6, so uv could not resolve `globus` and `test`
# together. Nothing else in either extra conflicts, so both now install side by
# side and the unit suite no longer has to run outside the globus extra.

# [tool.black] and [tool.isort] removed: the repo formats with ruff-format (see
# .pre-commit-config.yaml), whose default line length is 88, so `line-length =
# 100` here silently disagreed with how every file is actually formatted --
# running black reformatted ~80 unrelated lines. ruff's isort rules cover import
# sorting. Both tools also stayed in the `dev` extra long after nothing invoked
# them; they are dropped from there too.

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = [
    "--strict-markers",
    "--cov=parsl_ephemeral_provider",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    # A smoke floor only. This applies to *every* invocation, including narrow
    # ones -- `pytest tests/integration` alone measures 34% -- so it cannot carry
    # the project's real coverage target without breaking subset runs. The gate
    # that matters is `--cov-fail-under=65` on the CI unit-tests job, which runs
    # tests/unit + tests/security together (68% measured).
    "--cov-fail-under=25",
    "-ra",
    "--tb=short"
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may require the substrate AWS emulator)",
    "aws: Tests requiring real AWS credentials",
    "globus: Tests requiring Globus Compute credentials and a running endpoint",
    "slow: Slow-running tests",
    # Renamed from `localstack` in #125. Kept as a distinct marker from
    # `integration` because a subset of that directory is pure-moto and needs
    # no endpoint at all.
    "substrate: Tests requiring a running substrate AWS emulator",
    # Applied automatically by pytest_collection_modifyitems, never by hand.
    "setenv_aws(name, value): internal — synthetic AWS credentials for non-aws tests",
]

[tool.coverage.run]
source = ["parsl_ephemeral_provider"]
branch = true
omit = [
    "tests/*",
    "examples/*",
    "*/__init__.py",
    "*/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
]
fail_under = 10
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.bumpversion]
current_version = "0.8.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "parsl_ephemeral_provider/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
