# Substrate — the AWS emulator this suite tests against (#125).
#
# Replaces docker-compose.localstack.yml. LocalStack OSS is end-of-life: the
# upstream repository was archived read-only in March 2026, `4.14.0` is the last
# community image, and `localstack/localstack:latest` now resolves to the Pro
# build (byte-identical digest to `localstack/localstack-pro`), which exits 55 on
# "License activation failed!" without a LOCALSTACK_AUTH_TOKEN.
#
# Substrate is a single Go binary with no license gate, and it answers
# `/_localstack/health` with a LocalStack-shaped payload, so it is a drop-in.
#
# The old file needed SERVICES=ec2,ecs,lambda,s3,... plus PROVIDER_OVERRIDE_*
# and a bind-mounted /var/run/docker.sock (LocalStack shelled out to Docker to
# run Lambdas). Substrate needs none of that: every service its build supports is
# on by default, and nothing here mounts the container socket.

services:
  substrate:
    # Pinned, not `latest`: an emulator that silently changes under CI turns an
    # unrelated PR red. Bump deliberately.
    #
    # 0.82.0 was the first release with an EC2 `CreateFleet` handler (substrate
    # #387), which is what let the spot-fleet suite run against an endpoint
    # instead of moto. `RequestSpotFleet`/`RequestSpotInstances` are still
    # unimplemented and are not coming back here -- #86 moved this provider onto
    # CreateFleet, so nothing calls them.
    #
    # 0.85.0 is the first release carrying four fixes this suite waited on
    # (#183). Three land in 0.84.0 and one only in 0.85.0, so 0.84.0 is not
    # enough:
    #
    #   substrate#392 symbolic error codes -- `ParameterNotFound` instead of
    #     "404", which is the code ParameterStoreState.save_state() branches on
    #     to choose put-with-Overwrite vs create-with-Tags.
    #   substrate#443 `tag:aws:ec2:fleet-id` is set on fleet instances, so the
    #     hand-applied tag workaround in the spot-fleet integration test is gone.
    #   substrate#391 an unknown instance ID raises InvalidInstanceID.NotFound
    #     instead of returning 200 + an empty list -- it had silently defeated
    #     the #69 network guard, so _verify_resources never raised.
    #   substrate#446 (0.85.0 only) `?publicAccessBlock` is routed, so PUT no
    #     longer reaches CreateBucket and DELETE no longer deletes the bucket.
    #     That unblocks S3State(create_bucket_if_not_exists=True), which was
    #     xfailed and verified nowhere (#166).
    #
    # 0.87.0 clears three more, all filed from this repo while probing 0.85.0:
    #
    #   substrate#484 (262b911) IAM serves the service-role managed policies, so
    #     get_policy on AmazonSSMManagedInstanceCore resolves instead of raising
    #     NoSuchEntity for an ARN attach_role_policy had already accepted.
    #   substrate#485 (64912ef) the instance-type catalog covers every type this
    #     project names, an unknown type raises InvalidInstanceType, and the
    #     describe_instance_type_offerings `instance-type` filter discriminates
    #     instead of being dead code that could not fail.
    #   substrate#483 (ff3521a) a real `cloudformation` plugin is registered --
    #     through 0.85.0 CFN was implemented but unrouted, reachable only from Go
    #     via betty.Deploy. The whole surface this repo drives now works over the
    #     wire, which unskips the DetachedMode bastion test. That skip lifted
    #     itself: tests/conftest.py probes /_localstack/health rather than
    #     hardcoding a version.
    #
    # CFN is still not a moto replacement, for two reasons worth knowing before
    # you try: substrate does not resolve YAML short-form intrinsics (`!Sub`,
    # `!Ref`, `!If` are stripped and the raw scalar used literally, while the
    # `Fn::` long forms work), and StackDeployer.dispatch writes resources as
    # account 123456789012 while the caller is 000000000000. A stack built from
    # any template in templates/cloudformation/ therefore reaches CREATE_COMPLETE
    # having created nothing the caller can find. See docs/substrate_testing.md.
    #
    # Verify a bump reaches the image, not just the git tag: substrate cuts
    # release commits, so a merged fix sits on `main` after the newest tag and is
    # invisible to this pin. `git tag --contains <sha>` is the check.
    image: ghcr.io/scttfrdmn/substrate:0.87.0
    container_name: parsl-substrate
    ports:
      - "4566:4566"

    # No volume. State is in-memory and `POST /v1/state/reset` wipes it, which is
    # what tests use for isolation -- LocalStack's DATA_DIR/PERSISTENCE pair
    # existed because it had no reset endpoint, and persisting emulator state
    # across runs makes tests order-dependent.

    healthcheck:
      # /health, not /_localstack/health: it is substrate's own liveness endpoint
      # and returns a small fixed payload. wget, because the image is Alpine-based
      # and ships no curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:4566/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - parsl-test

networks:
  parsl-test:
    driver: bridge

