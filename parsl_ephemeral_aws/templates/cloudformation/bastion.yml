AWSTemplateFormatVersion: '2010-09-09'
Description: 'Parsl Ephemeral AWS Provider - Bastion Host for Detached Mode'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where resources will be created

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the bastion host

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the bastion host

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Instance type for the bastion host
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t4g.nano
      - t4g.micro
      - t4g.small

  ImageId:
    Type: AWS::EC2::Image::Id
    Description: AMI ID for the bastion host

  KeyName:
    Type: String
    Description: SSH key pair name for the bastion host
    Default: ''

  WorkflowId:
    Type: String
    Description: Unique ID for the workflow

  UserData:
    Type: String
    Description: Base64 encoded user data script
    Default: ''

  UseSpotInstance:
    Type: String
    Default: 'false'
    Description: Whether to use spot instances
    AllowedValues:
      - 'true'
      - 'false'

  SpotMaxPrice:
    Type: String
    Description: Maximum price for spot instances (empty for on-demand price)
    Default: ''

  IdleTimeout:
    Type: Number
    Default: 30
    Description: Minutes to wait before shutting down if idle

  Tags:
    Type: String
    Description: JSON encoded tags to apply to resources
    Default: '{}'

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  HasUserData: !Not [!Equals [!Ref UserData, '']]
  UseSpot: !Equals [!Ref UseSpotInstance, 'true']
  HasSpotMaxPrice: !Not [!Equals [!Ref SpotMaxPrice, '']]

Resources:
  BastionHostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BastionHostPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                  - ec2:CreateTags
                  - ec2:DescribeTags
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/parsl/workflows/${WorkflowId}/*'
      Tags:
        - Key: ParslResource
          Value: 'true'
        - Key: ParslWorkflowId
          Value: !Ref WorkflowId
        - Key: Name
          Value: !Sub 'parsl-bastion-role-${WorkflowId}'

  BastionHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BastionHostRole

  # A single template serves both the on-demand and the spot bastion. The spot
  # variant differs only by InstanceMarketOptions, which AWS::EC2::Instance does
  # not accept directly -- verified against the resource schema -- but which a
  # launch template does, and an Instance referencing that template launches as
  # spot. That replaces the AWS::EC2::SpotFleet resource this template used to
  # carry for the spot case (#86), which is on an API AWS describes as legacy and
  # which needed a service role the template never correctly provided.
  #
  # IMDSv2 is required here for the same reason as on every other launch path
  # (#85): the bastion holds an IAM role that can terminate instances.
  BastionLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'parsl-bastion-lt-${WorkflowId}'
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref ImageId
        IamInstanceProfile:
          Arn: !GetAtt BastionHostInstanceProfile.Arn
        KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
        UserData: !If [HasUserData, !Ref UserData, !Ref 'AWS::NoValue']
        InstanceInitiatedShutdownBehavior: terminate
        Monitoring:
          Enabled: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        InstanceMarketOptions: !If
          - UseSpot
          - MarketType: spot
            SpotOptions:
              SpotInstanceType: one-time
              InstanceInterruptionBehavior: terminate
              MaxPrice: !If
                - HasSpotMaxPrice
                - !Ref SpotMaxPrice
                - !Ref 'AWS::NoValue'
          - !Ref 'AWS::NoValue'
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: ParslResource
              Value: 'true'
            - Key: ParslWorkflowId
              Value: !Ref WorkflowId

  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref BastionLaunchTemplate
        Version: !GetAtt BastionLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub 'parsl-bastion-${WorkflowId}'
        - Key: ParslResource
          Value: 'true'
        - Key: ParslWorkflowId
          Value: !Ref WorkflowId
        - Key: ParslResourceType
          Value: 'bastion'
        - Key: ParslIdleTimeout
          Value: !Ref IdleTimeout

Outputs:
  BastionHostId:
    Description: ID of the bastion host
    Value: !Ref BastionHost

  BastionHostRole:
    Description: IAM role for the bastion host
    Value: !Ref BastionHostRole

  BastionHostRoleArn:
    Description: ARN of the IAM role for the bastion host
    Value: !GetAtt BastionHostRole.Arn
